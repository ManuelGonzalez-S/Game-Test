<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1b2545"/>
      <stop offset="60%" stop-color="#111a30"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <radialGradient id="coin" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="45%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#c98a1e"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- estrellas -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="70" cy="90" r="2.5"/><circle cx="440" cy="120" r="2"/>
    <circle cx="120" cy="430" r="2"/><circle cx="420" cy="410" r="2.5"/>
  </g>
  <!-- brillo -->
  <circle cx="256" cy="256" r="185" fill="#ffd54a" opacity="0.12"/>
  <!-- moneda -->
  <circle cx="256" cy="256" r="150" fill="url(#coin)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#8a5e14" stroke-width="10"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#b9861f" stroke-width="6" opacity="0.8"/>
  <!-- símbolo -->
  <text x="256" y="258" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="150"
        font-weight="900" fill="#7a531a">$</text>
  <!-- destello -->
  <ellipse cx="210" cy="205" rx="55" ry="34" fill="#ffffff" opacity="0.35"/>
