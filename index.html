<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="description" content="Coin Rush: genera monedas, mejoralas por el recorrido y llena el cofre de oro.">
  <title>🪙 Coin Rush</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coin Rush">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="money-row">
        <span id="money" class="money">0</span>
        <span class="money-icon">💰</span>
      </div>
      <div class="hud-sub">
        <span id="rate" class="rate">0 /s</span>
        <span id="tier-label" class="tier-label">Tier 1</span>
        <span id="diamonds" class="diamonds">💎 0</span>
      </div>
    </header>

    <main id="stage">
      <canvas id="board"></canvas>
    </main>

    <section id="controls">
      <div class="tier-bar">
        <div id="tier-fill" class="tier-bar-fill"></div>
        <span id="tier-text" class="tier-text"></span>
      </div>
      <div class="ctrl-row">
        <button id="btn-board" class="ctrl-btn">
          <span class="cb-title">⬆️ Subir tablero <span id="board-lvl"></span></span>
          <span id="board-cost" class="cb-cost"></span>
        </button>
        <button id="btn-ascend" class="ctrl-btn ascend" disabled>
          <span class="cb-title">✨ Ascender</span>
          <span id="ascend-info" class="cb-cost"></span>
        </button>
      </div>
      <div class="ctrl-row2">
        <button id="btn-skills" class="mini-btn">💎 Árbol</button>
        <button id="btn-backup" class="mini-btn">☁️ Copia</button>
        <button id="btn-reset" class="mini-btn danger">♻️ Reiniciar</button>
      </div>
      <p id="hint" class="hint">Toca una estación del recorrido para cambiarla.</p>
    </section>
  </div>

  <!-- Modal: cambiar estación -->
  <div id="swap-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>🔧 Cambiar estación</h2>
        <button id="swap-close" class="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <p id="swap-info" class="swap-info"></p>
      <div id="swap-list" class="swap-list"></div>
    </div>
  </div>

  <!-- Modal: árbol de habilidades -->
  <div id="skills-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>💎 Habilidades <span id="skills-diamonds" class="achv-count"></span></h2>
        <button id="skills-close" class="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <div id="skills-list" class="tree"></div>
    </div>
  </div>

  <!-- Modal: copia de seguridad -->
  <div id="save-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>☁️ Copia de seguridad</h2>
        <button id="save-close" class="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <p class="save-hint">📱 En iPhone la app usa un almacén separado. Copia este código
        para no perder tu progreso, o pégalo para restaurarlo.</p>
      <label class="save-label">Tu código:</label>
      <textarea id="save-code" class="save-code" readonly rows="3"></textarea>
      <button id="save-copy" class="mini-btn wide">📋 Copiar</button>
      <label class="save-label">Restaurar:</label>
      <textarea id="save-import" class="save-code" rows="3" placeholder="Pega un código…"></textarea>
      <button id="save-import-btn" class="mini-btn wide">📥 Importar</button>
    </div>
  </div>

  <div id="fx"></div>

  <script src="js/format.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/route.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
